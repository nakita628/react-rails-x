---
openapi: 3.1.0
info:
  title: x API
  version: 1.0.0
  description: 学習用の X（Twitter）クローン。サインインでセッション cookie が発行され、他の操作はそれを必要とする。
servers:
- url: http://localhost:3000
paths:
  "/api/link_preview":
    get:
      summary: show
      tags:
      - link_previews
      parameters:
      - name: url
        in: query
        required: false
        schema:
          type: string
        example: https://example.com/plain
      responses:
        '200':
          description: description だけのページ
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  title:
                    type:
                    - string
                    - 'null'
                  description:
                    type:
                    - string
                    - 'null'
                  image:
                    type:
                    - string
                    - 'null'
                  siteName:
                    type:
                    - string
                    - 'null'
                required:
                - url
                - title
                - description
                - image
                - siteName
              example:
                url: https://example.com/plain
                title:
                description: Just a description
                image:
                siteName:
        '400':
          description: 内部アドレスは 400
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                required:
                - type
                - title
                - status
                - detail
                - instance
              example:
                type: "/problems/bad-request"
                title: Bad Request
                status: 400
                detail: Internal destinations are not allowed
                instance: "/api/link_preview"
  "/api/media/{prefix}/{filename}":
    get:
      summary: show
      tags:
      - media
      parameters:
      - name: filename
        in: path
        required: true
        schema:
          type: string
        example: cpeku3elamwpowahruk8ipw2.png
      - name: prefix
        in: path
        required: true
        schema:
          type: string
        example: posts
      responses:
        '200':
          description: アップロードした画像はサインインなしで配信される
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: 存在しない画像は 404
  "/api/notifications":
    delete:
      summary: destroy
      tags:
      - notifications
      responses:
        '204':
          description: すべて削除する
    get:
      summary: index
      tags:
      - notifications
      responses:
        '200':
          description: 自分の通知が新しい順に返る
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    type:
                      type: string
                    read:
                      type: boolean
                    from:
                      type: object
                      properties:
                        id:
                          type: integer
                        username:
                          type: string
                        fullName:
                          type: string
                        profileImg:
                          type: string
                      required:
                      - id
                      - username
                      - fullName
                      - profileImg
                    createdAt:
                      type: string
                      format: date-time
                  required:
                  - id
                  - type
                  - read
                  - from
                  - createdAt
              example:
              - id: 729887420
                type: like
                read: false
                from:
                  id: 902541635
                  username: bob
                  fullName: Bob
                  profileImg: "/api/media/avatars/fixture.png"
                createdAt: '2026-01-02T01:00:00.000Z'
              - id: 698582621
                type: follow
                read: false
                from:
                  id: 708742340
                  username: carol
                  fullName: Carol
                  profileImg: "/api/media/avatars/fixture.png"
                createdAt: '2026-01-01T01:00:00.000Z'
        '422':
          description: page は 1 以上
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string
                      required:
                      - field
                      - message
                required:
                - type
                - title
                - status
                - detail
                - instance
                - errors
              example:
                type: "/problems/unprocessable-content"
                title: Unprocessable Content
                status: 422
                detail: The request failed validation. See `errors` for the offending
                  fields.
                instance: "/api/notifications"
                errors:
                - field: page
                  message: Page must be an integer of 1 or more
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: string
        example: first
    patch:
      summary: update
      tags:
      - notifications
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties: {}
            example: {}
      responses:
        '204':
          description: すべて既読にする
