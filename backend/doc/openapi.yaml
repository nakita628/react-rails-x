                img:
                author:
                  id: 663665735
                  username: alice
                  fullName: Alice
                  profileImg:
                likeCount: 1
                liked: true
                repostCount: 1
                reposted: false
                bookmarked: true
                comments:
                - id: 632426790
                  text: Nice post!
                  author:
                    id: 902541635
                    username: bob
                    fullName: Bob
                    profileImg: "/api/media/avatars/fixture.png"
                  createdAt: '2026-01-02T02:00:00.000Z'
