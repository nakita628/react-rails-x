                                type: integer
                              username:
                                type: string
                              fullName:
                                type: string
                              profileImg:
                                type: string
                            required:
                            - id
                            - username
                            - fullName
                            - profileImg
                          createdAt:
                            type: string
                            format: date-time
                        required:
                        - id
                        - text
                        - author
                        - createdAt
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
                    repostedBy:
                      type:
                      - object
                      - 'null'
                      properties:
                        id:
                          type: integer
                        username:
                          type: string
                        fullName:
                          type: string
                        profileImg:
                          type: string
                      required:
                      - id
                      - username
                      - fullName
                      - profileImg
                  required:
                  - id
                  - text
                  - img
                  - author
                  - likeCount
                  - liked
                  - repostCount
                  - reposted
                  - bookmarked
                  - comments
                  - createdAt
                  - updatedAt
